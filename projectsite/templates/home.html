{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="content">
    <div class="container-fluid">
        <h4 class="page-title">Dashboard</h4>
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Welcome to Hangarin</div>
                        <div class="card-category">Manage your productivity and tasks effectively.</div>
                    </div>
                    <div class="card-body">
                        <p>Currently tracking <b>{{ home.count }}</b> active tasks.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
