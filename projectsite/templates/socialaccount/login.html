{% load i18n %} {% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Confirm Google Login</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.css" />
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            /* Matching Dark Theme Gradient */
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #f1f5f9;
        }
        .auth-card {
            max-width: 500px;
            width: 100%;
            background: #1e293b; /* Dark slate background */
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            padding: 2.5rem;
            text-align: center;
            border: 1px solid #334155;
        }
        h3 {
            color: #ffffff;
            font-weight: 700;
        }
        p {
            color: #94a3b8;
        }
        .btn-primary {
            background-color: #3b82f6;
            text-transform: none;
            font-weight: 600;
        }
        .btn-outline-secondary {
            color: #94a3b8;
            border-color: #334155;
            text-transform: none;
        }
        .btn-outline-secondary:hover {
            background-color: #334155;
            color: #fff;
        }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="mb-4">
        <i class="fab fa-google fa-3x text-primary"></i>
    </div>
    <h3 class="mb-4">Confirm Sign In</h3>
    <p class="mb-4">You are about to sign in using your <strong>{{ provider.name }}</strong> account.</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary btn-block mb-3">Continue with {{ provider.name }}</button>
    </form>
    
    <a href="{% url 'account_login' %}" class="btn btn-outline-secondary btn-block"> Cancel </a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.js"></script>
</body>
</html>
